<svg viewBox="0 0 1740 480" role="group" aria-label="V2 执行单元横向图" xmlns="http://www.w3.org/2000/svg"><defs ><marker id="arrow-v2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c81a2"></path></marker></defs><path data-pipe-edge="dispatch-work" d="M310 75 L360 75" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-v2)"><title >任务、参数、版本</title></path><path data-pipe-edge="work-wait" d="M650 75 L700 75" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-v2)"><title >结果、参数、证据</title></path><path data-pipe-edge="wait-review" d="M990 75 L1040 75" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-v2)"><title >回传主控，等待批准</title></path><path data-pipe-edge="review-next" d="M1330 75 L1380 75" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-v2)"><title >本栋批准</title></path><path data-pipe-edge="review-discard" d="M1185 118 L1185 192" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-v2)"><title >任意当前步骤可弃用</title></path><path data-pipe-edge="discard-restart" d="M1330 235 L1380 235" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-v2)"><title >新 attempt</title></path><path data-pipe-edge="review-select" d="M1100 118 L1100 150 L10 150 L10 342 L165 342 L165 364" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-v2)"><title >任意步骤可局部回溯</title></path><path data-pipe-edge="select-redo" d="M310 407 L360 407" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-v2)"><title >选定 i 与参数差量</title></path><path data-pipe-edge="redo-replay" d="M650 407 L700 407" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-v2)"><title >新输入 + 后继历史同参</title></path><path data-pipe-edge="replay-review-again" d="M990 407 L1040 407" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-v2)"><title >逐步确认后回到 k</title></path><g data-pipe-node="dispatch" role="button" tabindex="0" aria-label="主控派发 · 第 k 轮：新决策上下文，固定本次任务与参数版本。" aria-pressed="false"><rect x="20" y="32" width="290" height="86" rx="14" fill="#ffdf4d" stroke="#8b6100" stroke-width="1.5"></rect><text x="38" y="63" fill="#252035" font-size="22" font-weight="700">主控派发 · 第 k 轮</text><text x="38" y="92" fill="#5c5368" font-size="17">输入 / 版本 / 参数 / Skill</text></g><g data-pipe-node="work" role="button" tabindex="0" aria-label="新工作会话 · 执行 k：A/B 是两个独立方案会话，同能力执行排队。" aria-pressed="false"><rect x="360" y="32" width="290" height="86" rx="14" fill="#e8eeff" stroke="#244fe8" stroke-width="1.5"></rect><text x="378" y="63" fill="#252035" font-size="22" font-weight="700">新工作会话 · 执行 k</text><text x="378" y="92" fill="#5c5368" font-size="17">固定任务包；同能力并发 1</text></g><g data-pipe-node="wait" role="button" tabindex="0" aria-label="提交待审 · 释放执行位：进入 WAITING_REVIEW 即释放执行槽；等待人工审核不占执行位置。" aria-pressed="false"><rect x="700" y="32" width="290" height="86" rx="14" fill="#fff0d7" stroke="#a36c18" stroke-width="1.5"></rect><text x="718" y="63" fill="#252035" font-size="22" font-weight="700">提交待审 · 释放执行位</text><text x="718" y="92" fill="#5c5368" font-size="17">下一栋可继续同一阶段</text></g><g data-pipe-node="review" role="button" tabindex="0" aria-label="主控接收 · 机器 + 人工：批准绑定该建筑、候选与参数版本；未批准不能进入自身下一阶段。" aria-pressed="false"><rect x="1040" y="32" width="290" height="86" rx="14" fill="#ffe2ee" stroke="#ce316f" stroke-width="1.5"></rect><text x="1058" y="63" fill="#252035" font-size="22" font-weight="700">主控接收 · 机器 + 人工</text><text x="1058" y="92" fill="#5c5368" font-size="17">可集中审核，每栋分别决定</text></g><g data-pipe-node="next" role="button" tabindex="0" aria-label="通过 · 进入下一阶段：机器检查与人工通过后，进入下一阶段或交接。" aria-pressed="false"><rect x="1380" y="32" width="290" height="86" rx="14" fill="#d5edcc" stroke="#357246" stroke-width="1.5"></rect><text x="1398" y="63" fill="#252035" font-size="22" font-weight="700">通过 · 进入下一阶段</text><text x="1398" y="92" fill="#5c5368" font-size="17">本栋获准后，新建工作会话</text></g><g data-pipe-node="discard" role="button" tabindex="0" aria-label="弃用 · 撤销提交资格：保留聊天、小回执与失败证据；大文件隔离后还需核验所有权与引用，源和 accepted 资产不随之删除。" aria-pressed="false"><rect x="1040" y="192" width="290" height="86" rx="14" fill="#ffe2ee" stroke="#ce316f" stroke-width="1.5"></rect><text x="1058" y="223" fill="#252035" font-size="22" font-weight="700">弃用 · 撤销提交资格</text><text x="1058" y="252" fill="#5c5368" font-size="17">保留证据；大文件隔离 7 天</text></g><g data-pipe-node="restart" role="button" tabindex="0" aria-label="重派 · 当前阶段 k：新工作会话重做当前阶段；V1 不提供历史 i→k 的局部参数回放。" aria-pressed="false"><rect x="1380" y="192" width="290" height="86" rx="14" fill="#e8eeff" stroke="#244fe8" stroke-width="1.5"></rect><text x="1398" y="223" fill="#252035" font-size="22" font-weight="700">重派 · 当前阶段 k</text><text x="1398" y="252" fill="#5c5368" font-size="17">新 attempt，重做并重新审核</text></g><g data-pipe-node="select" role="button" tabindex="0" aria-label="修复 · 选择历史环节 i：只修改历史 i 的指定变量，无关建筑与分支保留。" aria-pressed="false"><rect x="20" y="364" width="290" height="86" rx="14" fill="#d4f3ef" stroke="#14786b" stroke-width="1.5"></rect><text x="38" y="395" fill="#252035" font-size="22" font-weight="700">修复 · 选择历史环节 i</text><text x="38" y="424" fill="#5c5368" font-size="17">变更范围 / 参数差量 / 审核 k</text></g><g data-pipe-node="redo" role="button" tabindex="0" aria-label="新会话执行 i：新输入产出新版本；参数冲突时暂停并报告。" aria-pressed="false"><rect x="360" y="364" width="290" height="86" rx="14" fill="#d4f3ef" stroke="#14786b" stroke-width="1.5"></rect><text x="378" y="395" fill="#252035" font-size="22" font-weight="700">新会话执行 i</text><text x="378" y="424" fill="#5c5368" font-size="17">固定历史源，使用新参数</text></g><g data-pipe-node="replay" role="button" tabindex="0" aria-label="重跑受影响后继：逐个新会话重跑；每步回责任主控机器检查与人工确认，不暗改后继参数。" aria-pressed="false"><rect x="700" y="364" width="290" height="86" rx="14" fill="#d4f3ef" stroke="#14786b" stroke-width="1.5"></rect><text x="718" y="395" fill="#252035" font-size="22" font-weight="700">重跑受影响后继</text><text x="718" y="424" fill="#5c5368" font-size="17">i+1…k 沿用各自历史参数</text></g><g data-pipe-node="review-again" role="button" tabindex="0" aria-label="回到同一审核 k：回到 k 后重新决定；如问题来自建筑源，先交建筑主控修复，再执行受影响接入。" aria-pressed="false"><rect x="1040" y="364" width="290" height="86" rx="14" fill="#ffe2ee" stroke="#ce316f" stroke-width="1.5"></rect><text x="1058" y="395" fill="#252035" font-size="22" font-weight="700">回到同一审核 k</text><text x="1058" y="424" fill="#5c5368" font-size="17">新决策轮，机器 + 人工复审</text></g><text x="35" y="226" fill="#ce316f" font-size="28" font-weight="700">历史环节回溯</text><text x="35" y="260" fill="#696273" font-size="20">只改指定变量；后继沿用各自历史参数。</text><text x="35" y="292" fill="#696273" font-size="20">每栋分别批准；其他栋可以先完成并排队待审。</text><circle r="7" fill="#ff8539" stroke="#fffaf0" stroke-width="3" opacity="0" pointer-events="none"></circle></svg>