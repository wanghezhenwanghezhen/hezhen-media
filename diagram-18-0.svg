<svg viewBox="0 0 1740 480" role="group" aria-label="交互管线图横向图" xmlns="http://www.w3.org/2000/svg"><defs ><marker id="arrow-pipeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c81a2"></path></marker></defs><path data-pipe-edge="dot-release" d="M450 59 L640 59" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-pipeline)"><title >确认后发布</title></path><path data-pipe-edge="release-lowpoly" d="M930 59 L1120 59" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-pipeline)"><title >校验后提供版本</title></path><path data-pipe-edge="building-lowpoly" d="M280 186 L280 115 L1170 115 L1170 102" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-pipeline)"><title >按需调用</title></path><path data-pipe-edge="lowpoly-building" d="M1220 102 L1220 128 L310 128 L310 186" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-pipeline)"><title >版本与方法</title></path><path data-pipe-edge="map-lowpoly" d="M70 407 L10 407 L10 110 L1140 110 L1140 102" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-pipeline)"><title >按需调用同一能力</title></path><path data-pipe-edge="building-bw" d="M360 210 L510 210" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-pipeline)"><title >任务、参数、固定版本</title></path><path data-pipe-edge="bw-building" d="M510 250 L360 250" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-pipeline)"><title >结果、参数、证据</title></path><path data-pipe-edge="building-bq" d="M180 186 L180 158 L1070 158 L1070 186" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-pipeline)"><title >候选与检查范围</title></path><path data-pipe-edge="bq-building" d="M1095 272 L1095 292 L215 292 L215 272" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-pipeline)"><title >独审结论与限制</title></path><path data-pipe-edge="building-bp" d="M240 186 L240 142 L1520 142 L1520 186" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-pipeline)"><title >机器检查 + 人工通过</title></path><path data-pipe-edge="bp-map" d="M1535 272 L1535 340 L215 340 L215 364" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-pipeline)"><title >人工确认后跨域交接</title></path><path data-pipe-edge="map-mw" d="M360 388 L510 388" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-pipeline)"><title >任务、参数、固定版本</title></path><path data-pipe-edge="mw-map" d="M510 428 L360 428" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-pipeline)"><title >结果、参数、证据</title></path><path data-pipe-edge="map-mq" d="M180 364 L180 336 L1070 336 L1070 364" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-pipeline)"><title >候选与检查范围</title></path><path data-pipe-edge="mq-map" d="M1095 450 L1095 470 L215 470 L215 450" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-pipeline)"><title >独审结论与限制</title></path><path data-pipe-edge="map-mp" d="M240 364 L240 320 L1520 320 L1520 364" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-pipeline)"><title >机器检查 + 人工通过</title></path><path data-pipe-edge="map-building" d="M70 395 L35 395 L35 229 L70 229" fill="none" stroke="#aaa0b6" stroke-width="2" marker-end="url(#arrow-pipeline)"><title >建筑源问题交建筑主控</title></path><g data-pipe-node="dot" role="button" tabindex="0" aria-label="dot · 独立学习窗口：独立更新支路，不作为每次生产起点；反馈经独立决策后发布下一版。" aria-pressed="false"><rect x="160" y="16" width="290" height="86" rx="14" fill="#eee9ff" stroke="#7651bf" stroke-width="1.5"></rect><text x="178" y="47" fill="#252035" font-size="22" font-weight="700">dot · 独立学习窗口</text><text x="178" y="76" fill="#5c5368" font-size="17">人类沟通、学习与发布决策</text></g><g data-pipe-node="release" role="button" tabindex="0" aria-label="已发布版本包：发布版本校验后本地同步；激活与同步分开。" aria-pressed="false"><rect x="640" y="16" width="290" height="86" rx="14" fill="#eee9ff" stroke="#7651bf" stroke-width="1.5"></rect><text x="658" y="47" fill="#252035" font-size="22" font-weight="700">已发布版本包</text><text x="658" y="76" fill="#5c5368" font-size="17">Agent / Skill / 标注 / RAG</text></g><g data-pipe-node="lowpoly" role="button" tabindex="0" aria-label="lowpoly · 共享能力入口：建筑、地图两域按需调用同一能力；持续接线仍属于目标能力。" aria-pressed="false"><rect x="1120" y="16" width="290" height="86" rx="14" fill="#eee9ff" stroke="#7651bf" stroke-width="1.5"></rect><text x="1138" y="47" fill="#252035" font-size="22" font-weight="700">lowpoly · 共享能力入口</text><text x="1138" y="76" fill="#5c5368" font-size="17">按需读取兼容版，固定到任务</text></g><g data-pipe-node="building" role="button" tabindex="0" aria-label="建筑主控：每轮新决策上下文，同一逻辑主控；候选和独审结果均返回主控。" aria-pressed="false"><rect x="70" y="186" width="290" height="86" rx="14" fill="#ffdf4d" stroke="#8b6100" stroke-width="1.5"></rect><text x="88" y="217" fill="#252035" font-size="22" font-weight="700">建筑主控</text><text x="88" y="246" fill="#5c5368" font-size="17">派发、接收、审核与决策</text></g><g data-pipe-node="bw" role="button" tabindex="0" aria-label="建筑阶段 · 新工作会话：读取固定任务包，通过本地工具执行；地标、商店、住区均可调用 lowpoly。" aria-pressed="false"><rect x="510" y="186" width="290" height="86" rx="14" fill="#e8eeff" stroke="#244fe8" stroke-width="1.5"></rect><text x="528" y="217" fill="#252035" font-size="22" font-weight="700">建筑阶段 · 新工作会话</text><text x="528" y="246" fill="#5c5368" font-size="17">固定文档 / 参数 / Skill</text></g><g data-pipe-node="bq" role="button" tabindex="0" aria-label="建筑独立 Q · 新会话：可请求 JEV 建议；独立审核不能替代主控与人工批准。" aria-pressed="false"><rect x="950" y="186" width="290" height="86" rx="14" fill="#ffe2ee" stroke="#ce316f" stroke-width="1.5"></rect><text x="968" y="217" fill="#252035" font-size="22" font-weight="700">建筑独立 Q · 新会话</text><text x="968" y="246" fill="#5c5368" font-size="17">几何、运行、图片分开检查</text></g><g data-pipe-node="bp" role="button" tabindex="0" aria-label="已接受建筑包：机器检查与人工通过后形成建筑包；区分视觉出口与通用 GLB。" aria-pressed="false"><rect x="1390" y="186" width="290" height="86" rx="14" fill="#d5edcc" stroke="#357246" stroke-width="1.5"></rect><text x="1408" y="217" fill="#252035" font-size="22" font-weight="700">已接受建筑包</text><text x="1408" y="246" fill="#5c5368" font-size="17">几何 + 配方 + 图像 + 证据</text></g><g data-pipe-node="map" role="button" tabindex="0" aria-label="地图主控：建筑包经人工确认后交接；建筑源问题交回建筑主控修复。" aria-pressed="false"><rect x="70" y="364" width="290" height="86" rx="14" fill="#ffdf4d" stroke="#8b6100" stroke-width="1.5"></rect><text x="88" y="395" fill="#252035" font-size="22" font-weight="700">地图主控</text><text x="88" y="424" fill="#5c5368" font-size="17">语义、规划、接收与决策</text></g><g data-pipe-node="mw" role="button" tabindex="0" aria-label="地图阶段 · 新工作会话：固定版本、专项 Skill 与适用工具；按阶段执行和回传证据。" aria-pressed="false"><rect x="510" y="364" width="290" height="86" rx="14" fill="#e8eeff" stroke="#244fe8" stroke-width="1.5"></rect><text x="528" y="395" fill="#252035" font-size="22" font-weight="700">地图阶段 · 新工作会话</text><text x="528" y="424" fill="#5c5368" font-size="17">排布 / 地表 / 阴影 / 交付</text></g><g data-pipe-node="mq" role="button" tabindex="0" aria-label="地图独立 Q · 新会话：独审可提供建议，不自行发布；最终决定回对应主控及人类。" aria-pressed="false"><rect x="950" y="364" width="290" height="86" rx="14" fill="#ffe2ee" stroke="#ce316f" stroke-width="1.5"></rect><text x="968" y="395" fill="#252035" font-size="22" font-weight="700">地图独立 Q · 新会话</text><text x="968" y="424" fill="#5c5368" font-size="17">模型、运行、图像与接入</text></g><g data-pipe-node="mp" role="button" tabindex="0" aria-label="地图验收与多出口：人工验收后冻结，版本关联可追溯；二维与三维出口分别声明。" aria-pressed="false"><rect x="1390" y="364" width="290" height="86" rx="14" fill="#d5edcc" stroke="#357246" stroke-width="1.5"></rect><text x="1408" y="395" fill="#252035" font-size="22" font-weight="700">地图验收与多出口</text><text x="1408" y="424" fill="#5c5368" font-size="17">二维成果 / 声明能力的三维</text></g><circle r="7" fill="#ff8539" stroke="#fffaf0" stroke-width="3" opacity="0" pointer-events="none"></circle></svg>